<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        function changetext(){
            document.getElementById("para").innerText = "this is new paragraph";
        }
    </script>
</head>
<body>
    <p id="para">this is old paragraph</p>
    <button onclick="changetext()">click me!</button>
</body>
</html>
